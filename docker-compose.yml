services:
  clipboard-portal:
    build: .
    container_name: clipboard-portal
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TTL_DAYS=7
      - DATA_PATH=/app/data/clipboard.json
